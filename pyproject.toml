[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sp-patch-toolbox"
version = "0.1.0"
description = "Robust foreground segmentation and patch-coordinate HDF5 tooling for spatial proteomics images."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Spatial Proteomics Toolbox Contributors"}]
dependencies = [
  "h5py>=3.8",
  "numpy>=1.24",
  "Pillow>=9.0",
  "tifffile>=2023.2.28",
]

[project.optional-dependencies]
fluorescence = [
  "imagecodecs>=2023.9.18",
  "opencv-python-headless>=4.8",
  "openslide-python>=1.3",
]
trident = ["geopandas>=0.14"]
training = ["torch>=2.1"]
dev = ["pytest>=7.4"]

[project.scripts]
sppatch = "sp_patch_toolbox.cli:main"
sppatch-segment = "sp_patch_toolbox.compat.legacy_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sp_patch_toolbox = ["configs/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
